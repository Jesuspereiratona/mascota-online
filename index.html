<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mascota Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <main class="container mt-4">
        <section class="row text-center mb-4">
            <div class="col">
                <h1 id="mascota-nombre">Mi mascota</h1>
                <p id="mascota-tipo" class="text-muted">Tipo mascota</p>
            </div>
        </section>
        <section class="row justify-content-center mb-4">
            <img id="mascota-img" src="./assets/img/standby.png" alt="visualizacion de mascota" style="width: 300px; object-fit: contain;">
        </section>
        <section class="row justify-content-center">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Estado de la Mascota</h5>
                        <div class="progress mb-3" role="progressbar" aria-label="barra de nivel de saciedad" aria-valuenow="25"
                            aria-valuemin="0" aria-valuemax="100" style="height: 25px;">
                            <div id="mascota-saciedad" class="progress-bar bg-warning text-dark fw-bold" style="width: 25%">Saciedad: 25%</div>
                        </div>
                        <div class="progress" role="progressbar" aria-label="barra de nivel de energia" aria-valuenow="25"
                            aria-valuemin="0" aria-valuemax="100" style="height: 25px;">
                            <div id="mascota-energia" class="progress-bar bg-info text-dark fw-bold" style="width: 25%">Energia: 25%</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="row justify-content-center gap-2">
            <div class="col-auto">
                <button id="btn-comer" type="button" class="btn btn-warning btn-lg shadow-sm">🍕 Comer</button>
            </div>
            <div class="col-auto">
                <button id="btn-jugar" type="button" class="btn btn-success btn-lg shadow-sm">🎾 Jugar</button>
            </div>
            <div class="col-auto">
                <button id="btn-dormir" type="button" class="btn btn-primary btn-lg shadow-sm">💤 Dormir</button>
            </div>
        </section>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
    <script src="./assets/js/mascota.js"></script> 
</body>

</html>
